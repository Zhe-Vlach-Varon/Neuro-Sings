[project]
name = "Neuro-Songs"
version = "0.1.0"
description = "Formatting Neuro songs to be better in media players"
authors = [{ name = "Zhe_Vlach_Varon", email = "42blah6434@gmail.com" },
           { name = "Matthieu Basset", email = "bassetmatt@gmail.com" }]
dependencies = [
    "connectorx>=0.4.3",
    "loguru>=0.7.3",
    "mutagen>=1.47.0",
    "pandas>=2.3.0",
    "pillow>=11.2.1",
    "polars>=1.30.0",
    "pyarrow>=20.0.0",
    "python-dateutil>=2.8",
    "sqlalchemy>=2.0.41",
    "tqdm>=4.67.1",
    "tinytag>=2.2.0",
    "xxhash>=3.6.0",
]
requires-python = ">=3.11, <3.13"
readme = "README.md"
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]

# WHEN ADDING A COMMAND HERE, run 'pdm install' after for it to be added to path
[project.scripts] # Shortcuts, have a command for main run so that it emulates a "real" run
songs-generate = "ai_vt_singer.run:generate_songs"
songs-generate-group = "ai_vt_singer.run:generate_songs_group"
albums-generate = "ai_vt_singer.run:generate_albums"
update-json = "ai_vt_singer.run:new_batch_detection"
thumbnails-generate = "ai_vt_singer.thumbnails:generate_main"
thumbnails-old = "ai_vt_singer.thumbnails:generate_oldge"
update-db = "ai_vt_singer.json_to_csv:update_db"
clear-db = "ai_vt_singer.json_to_csv:clear_db"
db-check = "ai_vt_singer.checks:all_tests"
check-group = "ai_vt_singer.run:check_group"
inputs-pull = "ai_vt_singer._shortcuts:inputs_pull"
setlists-pull = "ai_vt_singer._shortcuts:setlists_pull"
setlists-push = "ai_vt_singer._shortcuts:setlists_push"
drive-pull = "ai_vt_singer._shortcuts:drive_pull"
drive-push = "ai_vt_singer._shortcuts:drive_push"
db-sync = "ai_vt_singer._shortcuts:dbs_sync"
mp3gain-standalone = "ai_vt_singer.run:mp3gain_standalone"
setlist-check = "ai_vt_singer.detection:run_setlist_check"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    # Linting is a dev tool, not a runtime dependency (see AGENTS.md: ruff).
    "ruff>=0.16.5",
]

[tool.ruff] # See https://github.com/astral-sh/ruff#configuration
line-length = 120
