# ── project identity ──────────────────────────────────────────────
# Who sings in this project. `name` is the canonical singer name used in the DB,
# `flag` is the DB flag token, `display-name` is the ID3 tag name, `cover-suffix`
# is the token in cover-image filenames, and `album-artist` is the TPE2/TSO2 value.
[project]
name = "neuro"
display-name = "Neuro Twins"
voice-versions = ["v1", "v2", "v3"]
duet-group-name = "Twins"
# Lead-singer names that are classified as ARG (get the 'arg;' flag). Empty = no ARG songs.
arg-singers = ["Study-sama"]
# Album name assigned to ARG rows in the DB (defaults to "<display-name> ARG" if unset;
# pinned here because existing rows use "Neuro-sama ARG")
arg-album = "Neuro-sama ARG"

[[project.artists]]
name = "Neuro"
flag = "neuro"
display-name = "Neuro-Sama"
cover-suffix = "neuro"
album-artist = "Neuro-Sama/Evil Neuro"

[[project.artists]]
name = "Evil"
flag = "evil"
display-name = "Evil Neuro"
cover-suffix = "evil"
album-artist = "Neuro-Sama/Evil Neuro"

# Song-specific overrides: title → name_tag value (checked before flag-based logic)
[project.song-overrides.name-tag]
"Chinatown Blues" = "Neuro + Vedal"

# Song-specific overrides: title → version value (used by extract_official)
[project.song-overrides.version]
"Chinatown Blues" = "2"

# Thumbnail background images (optional — omit if this project doesn't generate thumbnails)
# solo: singer_name → {duet_version: filename}  (singers not listed get no solo image)
[project.thumbnails.solo.Neuro]
v1 = "nwero.png"
v2v1 = "newero.png"
v2 = "newero.png"

[project.thumbnails.solo.Evil]
v1 = "eliv.png"
v2v1 = "eliv.png"
v2 = "neweliv.png"

# duet: duet_version → filename  (keys also define the valid duet versions)
[project.thumbnails.duet]
v1 = "smocus.jpg"
v2v1 = "smocus_inter.png"
v2 = "smocus_new.png"

# ── drive (rclone remote names) ───────────────────────────────────
[drive]
public = "Neuro-Sings-ZVV"
private = "Neuro-Sings-ZVV-official-releases"
source = "unofficialV3"

[output]
# If disabled, the path in presets are directly applied, relative or absolute
# If enabled, the paths in presets must be relative
use-root = true
# Can be relative or absolute
out-root = "out"
# whether to make file links or make full copies
make-links = true

[features]
# Needs mp3gain installed and accessible via the path
# More info in README
activated = ["mp3gain"]

[features.mp3gain]
# Runs mp3 gain on all files from a preset, it averages the gain over all files for a smoother experience.
# Warning: It can take a long time !
# Modes are "per-preset" | "on-all"
# Per-preset needs to have a boolean on each preset to know if mp3gain is ran
# On-all just bypasses the boolean, doesn't check for its existence, activates mp3gain for all
mode = "per-preset"
# Whether to juste add a tag giving the gain information or change it directly
# Options are "gain" | "tag"
# Gain actually changes the gain of the file, it modifies the file's gain!
# Tag just writes a tag giving the gain information, doesn't modify the file's audio
type = "gain"

# include-type | exclude-type
# modes are "and" | "or" defaults to "or"
# what mode to use for include/exclude flags

[[Presets]]
name = "Main"
group = "original_sort"
include-flags = ["duet", "evil", "neuro", "mashup"]
exclude-flags = ["arg", "duplicate", "v1", "v2", "encore", "unused"]
# From root
path = "main"
mp3gain = false

[[Presets]]
name = "Old"
group = "original_sort"
include-flags = ["v1", "v2"]
exclude-flags = ["arg", "duplicate", "encore", "unused"]
# From root
path = "v1v2"
mp3gain = false

[[Presets]]
name = "Duplicates v3"
group = "original_sort"
include-flags = ["duplicate"]
exclude-flags = ["arg", "v1", "v2", "encore", "unused"]
# From root
path = "duplicates/v3"
mp3gain = false

[[Presets]]
name = "Duplicates v1-v2"
group = "original_sort"
include-flags = ["duplicate"]
exclude-flags = ["arg", "v3", "encore", "unused"]
# From root
path = "duplicates"
mp3gain = false

[[Presets]]
name = "ARG"
group = "original_sort"
include-flags = ["arg"]
exclude-flags = []
#from root
path = "arg"
mp3gain = false

[[Presets]]
name = "ENCORE"
group = "original_sort"
include-flags = ["encore"]
exclude-flags = []
path = "encore"
mp3gain = false

[[Presets]]
name = "Unused"
group = "original_sort"
include-flags = ["unused"]
exclude-flags = []
path = "unused"
mp3gain = false


