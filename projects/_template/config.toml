# ── project identity ──────────────────────────────────────────────
# Edit these values to match your project.
[project]
name = "my-project"
display-name = "My Project"
voice-versions = ["v1"]
duet-group-name = "Duet"
# Lead-singer names that are classified as ARG (get the 'arg;' flag). Empty = no ARG songs.
arg-singers = []
# Album name assigned to ARG rows in the DB (only used if arg-singers is non-empty;
# defaults to "<display-name> ARG" when unset)
# arg-album = "My Project ARG"
# Path to the ARG subdirectory within the unofficial archive, relative to
# songs/<unofficialv3 dir>. Only used if arg-singers is non-empty; omit if no ARG songs.
# arg-subdir = "Extra Content/DISC 66 - ARG"

[[project.artists]]
name = "SingerA"
flag = "singer_a"
display-name = "Singer A"
cover-suffix = "singer_a"
album-artist = "Singer A"

# Add more artists here as needed:
# [[project.artists]]
# name = "SingerB"
# flag = "singer_b"
# display-name = "Singer B"
# cover-suffix = "singer_b"
# album-artist = "Singer A/Singer B"

# Song-specific overrides (optional — omit if not needed)
# [project.song-overrides.name-tag]
# "Some Song Title" = "Singer A + Other"

# [project.song-overrides.version]
# "Some Song Title" = "2"

# Font used for thumbnail date text (file inside fonts/). Default: "First Coffee.ttf".
# font-file = "MyFont.ttf"

# Image subdirectories, relative to the project root. Defaults shown — override only if needed.
# [project.images]
# covers = "images/cover"   # dated cover art written/read here
# custom = "images/custom"  # custom-song cover images
# bg = "images/bg"          # thumbnail background images

# Non-karaoke setlist folders, keyed by voice version (paths relative to setlists/).
# Omit the whole table if the project has no non-karaoke setlists.
# [project.setlists.non-karaoke]
# v1 = "v1 voice/non-karaoke"
# v2 = "v2 voice/non-karaoke"

# Input audio subdirectories under songs/, keyed by semantic name. Defaults shown —
# override only if your archive uses different folder names.
# [project.song-dirs]
# drive = "drive"
# custom = "custom"
# unofficialv3 = "unofficialV3"
# official = "officially_released_songs"
# copyright = "copyright_issues"

# Thumbnail background images (optional — omit if this project doesn't generate thumbnails)
# solo: singer_name → {duet_version: filename}
# [project.thumbnails.solo.SingerA]
# v1 = "singer_a_v1.png"
# v2 = "singer_a_v2.png"
#
# duet: duet_version → filename (keys also define the valid duet versions)
# [project.thumbnails.duet]
# v1 = "duet_v1.jpg"
# v2 = "duet_v2.jpg"

# ── drive (rclone remote names) ───────────────────────────────────
# Set these to the rclone remote names for your project's drives.
# Leave empty/absent if you don't use Google Drive sync.
[drive]
public = ""
private = ""
source = ""

# ── output ────────────────────────────────────────────────────────
[output]
use-root = true
out-root = "out"
make-links = true

# ── features ──────────────────────────────────────────────────────
[features]
activated = []

# [features.mp3gain]
# mode = "per-preset"
# type = "gain"

# ── presets ───────────────────────────────────────────────────────
# Define your presets here. Each preset selects songs by flag inclusion/exclusion.
# See the main project's config.toml for detailed examples.
#
# [[Presets]]
# name = "All Songs"
# group = "default"          # optional; groups presets for songs-generate-group / check-group
#                            # and becomes the parent folder of the output (path → group/path).
#                            # Presets without a group belong to the implicit "default" group.
# path = "all"
# include-flags = ["singer_a", "singer_b"]
# exclude-flags = []
# include-type = "or"        # "or" (any listed flag) or "and" (ALL listed flags), default "or"
# exclude-type = "or"        # same modes, default "or"
# mp3gain = false            # only honored in per-preset mp3gain mode ([features.mp3gain])
